# Global Alert Settings
# Thresholds apply to every card on the watchlist.

alerts:

  # ── Trigger 1: Manual target ─────────────────────────────────────────────
  # Set per-card in watchlist.yaml. No global setting needed.

  # ── Trigger 2: Percentage drop over N days ───────────────────────────────
  # Momentum signal. Anchored to price N days ago.
  # "This card dropped fast recently."
  pct_drop:
    enabled: true
    threshold_pct: 15       # Alert if price dropped >= 15%...
    lookback_days: 30       # ...compared to price 30 days ago

  # ── Trigger 3: Percentage off 52-week high ───────────────────────────────
  # Correction signal. Anchored to the highest price in the past year.
  # "This card is well below where it was at its best."
  # Catches gradual declines that pct_drop misses (e.g., 2%/month for 6 months).
  pct_off_52w_high:
    enabled: true
    threshold_pct: 25       # Alert if current price is >= 25% below 52-week high

  # ── Trigger 4: Within X% of 52-week low ─────────────────────────────────
  # Bargain signal. Anchored to the lowest price in the past year.
  # "This card is near its floor."
  near_52w_low:
    enabled: true
    threshold_pct: 10       # Alert if current price is within 10% of 52-week low

# ── Re-arm logic ─────────────────────────────────────────────────────────────
# Once an alert fires, suppress it until one of two conditions is met:
#   1. Price drops FURTHER than the price when the alert last fired (lower_price).
#   2. Price recovers above last_alert_price by recovery_pct, then drops again.
#      This prevents an alert being permanently suppressed after a one-time drop
#      if the card later recovers and re-declines.
rearm:
  mode: lower_price
  recovery_pct: 10          # If price rises 10% above last_alert_price, reset the alert
                            # so it can fire fresh on the next decline.

# ── Discord ───────────────────────────────────────────────────────────────────
discord:
  quiet_if_nothing_triggered: true   # No message on days with zero alerts
  run_hour_utc: 14                   # 14:00 UTC = 7am PT / 10am ET (adjust to taste)

# ── Alert state schema (for reference — do not edit) ─────────────────────────
# alert_state.json tracks the last alert price per card × foil_type × trigger.
# Structure:
#   {
#     "Roaming Throne": {
#       "nonfoil": {
#         "manual":          null,   ← null = never fired or reset
#         "pct_drop":        null,
#         "pct_off_52w_high": null,
#         "near_52w_low":    null
#       },
#       "foil": { ... same ... }
#     }
#   }
